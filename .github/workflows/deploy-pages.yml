name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'Lab-01-Industry-Insight/frontend/**'
      - 'docs/manual/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    # 只在课程原仓库发布；学员 fork 推送 frontend 改动时跳过，避免 fork 没开 Pages 报错
    if: github.repository == 'atlascopco-Lab/atlas-copilot-agent-labs'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Assemble site
        run: |
          rm -rf _site
          mkdir -p _site
          # Lab-01 行业洞察周报（report.md 给网页渲染，report.json 给 Copilot Studio 等外部系统读取）
          cp -r Lab-01-Industry-Insight/frontend/. _site/
          # 学员实操手册：<Pages 地址>/manual/
          mkdir -p _site/manual
          cp -r docs/manual/. _site/manual/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
